name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  provider-free-tests:
    runs-on: ubuntu-latest
    env:
      PI_SCHEDULE_FIXTURE_ROOT: ${{ runner.temp }}/tmp/pi-schedule-online
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: mkdir -p tmp && npm pack --ignore-scripts --pack-destination tmp
